<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Elite Athlete - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@500;600&amp;family=Lexend:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "on-primary": "#283500",
                        "surface-tint": "#abd600",
                        "tertiary": "#ffffff",
                        "primary-fixed": "#c3f400",
                        "on-tertiary-fixed": "#410001",
                        "error-container": "#93000a",
                        "on-surface": "#e5e2e1",
                        "inverse-primary": "#506600",
                        "inverse-on-surface": "#313030",
                        "on-error": "#690005",
                        "outline-variant": "#444933",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#930005",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "tertiary-fixed": "#ffdad5",
                        "on-secondary-fixed": "#001f25",
                        "on-secondary-container": "#005f6d",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#00daf8",
                        "on-background": "#e5e2e1",
                        "primary": "#ffffff",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-highest": "#353534",
                        "surface-dim": "#131313",
                        "on-primary-fixed-variant": "#3c4d00",
                        "on-secondary": "#00363f",
                        "primary-container": "#c3f400",
                        "outline": "#8e9379",
                        "inverse-surface": "#e5e2e1",
                        "secondary-fixed": "#a5eeff",
                        "surface": "#131313",
                        "secondary-container": "#00e0ff",
                        "surface-variant": "#353534",
                        "on-surface-variant": "#c4c9ac",
                        "primary-fixed-dim": "#abd600",
                        "on-primary-fixed": "#161e00",
                        "surface-container": "#201f1f",
                        "surface-bright": "#393939",
                        "on-tertiary": "#690003",
                        "on-tertiary-container": "#ca0a0f",
                        "on-primary-container": "#556d00",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-container": "#ffdad5",
                        "secondary": "#b9f1ff",
                        "on-secondary-fixed-variant": "#004e5a",
                        "background": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "16px",
                        "xs": "8px",
                        "base": "4px",
                        "md": "24px",
                        "margin": "20px",
                        "lg": "40px",
                        "xl": "64px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Lexend"],
                        "label-caps": ["Lexend"],
                        "headline-md": ["Anton"],
                        "body-lg": ["Lexend"],
                        "data-lg": ["JetBrains Mono"],
                        "data-sm": ["JetBrains Mono"],
                        "display-lg": ["Anton"],
                        "headline-lg": ["Anton"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "data-lg": ["20px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "data-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glow-primary {
            box-shadow: 0 0 15px rgba(195, 244, 0, 0.2);
        }
        .glow-primary-active {
            box-shadow: 0 0 20px rgba(195, 244, 0, 0.4);
        }
        .inner-glow {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="bg-surface/60 dark:bg-surface/60 backdrop-blur-xl border-b border-white/5 fixed top-0 w-full z-50 flat no shadows flex justify-between items-center px-margin h-16 w-full">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<h1 class="font-headline-lg text-headline-lg tracking-wider text-primary dark:text-primary">ELITE ATHLETE</h1>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-white/10">
<!-- Avatar Placeholder for structure, but since it's onboarding, maybe just empty space to balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[88px] px-margin pb-xl flex flex-col max-w-2xl mx-auto w-full relative">
<!-- Progress Indicator -->
<div class="w-full flex gap-2 mb-lg">
<div class="h-1 flex-1 bg-primary-container rounded-full glow-primary"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
</div>
<div class="mb-xl">
<h2 class="font-display-lg text-display-lg text-primary mb-sm uppercase">Select Your Level</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Calibrate the engine. This determines your initial volume and intensity.</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 gap-md flex-grow">
<!-- Option 1 -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="fitness_level" type="radio" value="beginner"/>
<div class="bg-surface-container-high border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container rounded-xl p-md transition-all duration-200 inner-glow flex items-center justify-between peer-checked:glow-primary-active">
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-primary mb-base uppercase">Beginner</h3>
<p class="font-body-md text-body-md text-on-surface-variant">0-1 years consistent training. Focus on form and baseline strength.</p>
</div>
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-primary-container ml-sm transition-colors">stat_1</span>
</div>
</label>
<!-- Option 2 -->
<label class="group relative cursor-pointer block">
<input checked="" class="peer sr-only" name="fitness_level" type="radio" value="intermediate"/>
<div class="bg-surface-container-high border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container rounded-xl p-md transition-all duration-200 inner-glow flex items-center justify-between peer-checked:glow-primary-active">
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-primary mb-base uppercase">Intermediate</h3>
<p class="font-body-md text-body-md text-on-surface-variant">1-3 years training. Familiar with progressive overload.</p>
</div>
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-primary-container ml-sm transition-colors">stat_2</span>
</div>
</label>
<!-- Option 3 -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="fitness_level" type="radio" value="advanced"/>
<div class="bg-surface-container-high border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container rounded-xl p-md transition-all duration-200 inner-glow flex items-center justify-between peer-checked:glow-primary-active">
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-primary mb-base uppercase">Advanced</h3>
<p class="font-body-md text-body-md text-on-surface-variant">3+ years. Requires specialized programming and high volume.</p>
</div>
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-primary-container ml-sm transition-colors">stat_3</span>
</div>
</label>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-xl fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-margin border-t border-white/5 pb-[calc(20px+env(safe-area-inset-bottom))] z-40">
<div class="max-w-2xl mx-auto flex justify-between items-center">
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary py-xs px-sm uppercase transition-colors">
                    Back
                </button>
<button class="bg-gradient-to-br from-primary-container to-[#8ba800] text-on-primary-container font-label-caps text-label-caps py-sm px-xl rounded-lg uppercase tracking-wider glow-primary hover:opacity-90 transition-opacity flex items-center gap-2">
                    Next Step
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Navigation Suppressed: Transactional Onboarding Flow -->
</body></html>
