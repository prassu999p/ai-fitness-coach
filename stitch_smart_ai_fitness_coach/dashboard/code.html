<style>

            content: '';

<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-xl border-b border-white/5 flex justify-between items-center px-margin h-16 flat no shadows">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg tracking-wider text-primary dark:text-primary uppercase">ELITE ATHLETE</h1>
<button class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-150 flex-shrink-0">

</button>
</header>
<!-- Main Content Canvas -->

<div class="flex justify-between items-center bg-surface-container-low rounded-xl p-4 border border-white/5 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
<!-- Completed -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">M</span>
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center border border-primary-container shadow-[0_0_12px_rgba(195,244,0,0.2)]">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Completed -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">T</span>
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center border border-primary-container shadow-[0_0_12px_rgba(195,244,0,0.2)]">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Rest Day -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">W</span>
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center border border-white/10 opacity-60">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" style="font-variation-settings: 'wght' 300;">bed</span>
</div>
</div>

<span class="font-label-caps text-label-caps text-on-surface-variant">T</span>
<div class="w-8 h-8 rounded-full bg-error-container/20 flex items-center justify-center border border-error">
<span class="material-symbols-outlined text-[16px] text-error" style="font-variation-settings: 'wght' 600;">close</span>
</div>
</div>

<div class="flex flex-col items-center gap-xs relative">
<span class="font-label-caps text-label-caps text-primary">F</span>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center border-2 border-primary-container relative z-10 shadow-[0_0_15px_rgba(195,244,0,0.4)]">

</div>

<div class="absolute -bottom-2 w-4 h-[2px] bg-primary-container rounded-full"></div>
</div>
<!-- Future -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-50">S</span>
<div class="w-8 h-8 rounded-full border border-dashed border-white/20 flex items-center justify-center opacity-50">
</div>
</div>
<!-- Future -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-50">S</span>

</div>
</div>
</div>

<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                    CURRENT STREAK

<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-primary drop-shadow-[0_0_20px_rgba(255,255,255,0.4)] tracking-tight">14</span>
<span class="font-data-lg text-data-lg text-on-surface-variant">DAYS</span>
</div>
<div class="mt-4 px-4 py-1.5 bg-surface-container-high rounded-full border border-outline-variant flex items-center gap-2 shadow-inner">
<span class="font-data-sm text-data-sm text-on-surface-variant">PERSONAL BEST: <span class="text-primary">45</span></span>

<div class="absolute inset-0 bg-gradient-to-t from-[#0e0e0e] via-[#0e0e0e]/80 to-transparent"></div>

</div>
<!-- Card Content -->
<div class="relative p-6 flex flex-col justify-end h-[280px]">
<div class="mb-auto flex justify-between items-start">
<div class="px-3 py-1 bg-primary-container text-on-primary-container font-label-caps text-label-caps rounded flex items-center gap-1 shadow-[0_0_15px_rgba(195,244,0,0.3)]">
<span class="material-symbols-outlined text-[14px]">bolt</span>
                            SUGGESTED
                        </div>
<button class="w-10 h-10 rounded-full bg-surface/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-primary hover:bg-surface/60 transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex flex-col gap-1">
<span class="font-data-sm text-data-sm text-surface-tint tracking-widest uppercase">Hypertrophy Phase</span>
<h3 class="font-headline-lg text-headline-lg text-primary uppercase leading-none drop-shadow-md">CHEST &amp; TRICEPS</h3>
<div class="flex items-center gap-4 mt-3">
<div class="flex items-center gap-1.5 text-on-surface">
<span class="material-symbols-outlined text-[18px] opacity-70">schedule</span>
<span class="font-data-lg text-data-lg text-[16px]">45 MIN</span>
</div>
<div class="w-1 h-1 rounded-full bg-white/30"></div>
<div class="flex items-center gap-1.5 text-on-surface">
<span class="material-symbols-outlined text-[18px] opacity-70">fitness_center</span>
<span class="font-data-lg text-data-lg text-[16px]">INTENSE</span>
</div>
</div>
</div>
</div>
</div>

<button class="w-full relative overflow-hidden bg-gradient-to-br from-primary-container to-surface-tint text-on-primary-container font-label-caps text-label-caps text-[14px] py-5 rounded-xl shadow-[0_0_25px_rgba(195,244,0,0.25)] hover:shadow-[0_0_35px_rgba(195,244,0,0.4)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group">

<span class="material-symbols-outlined text-[24px] relative z-10" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

</button>
<button class="w-full bg-surface-container border border-outline-variant text-primary font-label-caps text-label-caps text-[14px] py-4 rounded-xl hover:bg-surface-container-high hover:border-white/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px] opacity-70">history</span>
                LOG PAST WORKOUT
            </button>
</section>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-20 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-t border-white/5 shadow-[0_-4px_20px_rgba(171,214,0,0.15)]">
<!-- Active Tab: DASHBOARD -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1.5 shadow-[0_0_15px_rgba(195,244,0,0.3)] scale-90 transition-all duration-200 w-1/4">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-caps text-label-caps text-[10px]">DASHBOARD</span>
</button>
<!-- Inactive Tab: WORKOUT -->
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-colors hover:opacity-100 w-1/4">
<span class="material-symbols-outlined mb-1">fitness_center</span>
<span class="font-label-caps text-label-caps text-[10px]">WORKOUT</span>
</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-colors hover:opacity-100 w-1/4">

<span class="font-label-caps text-label-caps text-[10px]">HISTORY</span>
</button>
<!-- Inactive Tab: PROFILE -->
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-colors hover:opacity-100 w-1/4">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-caps text-label-caps text-[10px]">PROFILE</span>
</button>
</nav>
